<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">aumento·renta</title>
  <desc id="d">¿Cuánto puede subir tu renta? Actualización con el INPC del INEGI o con UDIS, con los valores publicados en el DOF y el tope legal de la Ciudad de México. Ejemplo: renta de 12,000 pesos, INPC de octubre de 2025 a octubre de 2026, nueva renta de 12,450.33 pesos.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#eceee6" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0" r="0.8">
      <stop offset="0" stop-color="#cfff45" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#cfff45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfff45" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#cfff45" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="420" rx="24"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    .serif { font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, 'Times New Roman', serif; font-style: italic; }
    .draw { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 6s ease-out infinite; }
    .tip { transform-box: fill-box; transform-origin: center; animation: tip 6s ease-out infinite; }
    .caret { animation: blink 1.1s steps(1, end) infinite; }
    .count { animation: rise 6s ease-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 520; } 55%, 100% { stroke-dashoffset: 0; } }
    @keyframes tip { 0%, 50% { opacity: 0; transform: scale(0.4); } 60%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes rise { 0%, 45% { opacity: 0; } 60%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .draw, .tip, .caret, .count { animation: none; }
      .draw { stroke-dashoffset: 0; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="#0a0c10"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>

    <!-- brand -->
    <g transform="translate(72 68)">
      <rect width="44" height="44" rx="11" fill="none" stroke="#cfff45" stroke-width="5"/>
      <path d="M11 31 20 22l6 6 9-11" fill="none" stroke="#cfff45" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M28 16h8v8" fill="none" stroke="#cfff45" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="132" y="102" class="serif" font-size="40" font-weight="500" fill="#cfff45">aumento</text>
    <text x="262" y="101" class="mono" font-size="31" font-weight="700" fill="#eceee6">·renta</text>

    <!-- headline -->
    <text x="68" y="204" class="serif" font-size="80" font-weight="500" fill="#cfff45">¿Cuánto puede subir</text>
    <text x="72" y="262" class="mono" font-size="50" font-weight="700" fill="#eceee6">tu renta?</text>
    <text x="72" y="306" class="mono" font-size="19" font-weight="700" fill="#eceee6">INPC (INEGI) · UDIS (Banxico) · tope legal CDMX</text>
    <text x="72" y="340" class="mono" font-size="16" fill="#969dab">valores del DOF · paso a paso · PWA sin conexión · sin rastreo<tspan class="caret" fill="#cfff45"> _</tspan></text>
    <g transform="translate(72 362)">
      <rect width="228" height="30" rx="15" fill="none" stroke="#ffb648" stroke-opacity="0.7"/>
      <text x="114" y="20" text-anchor="middle" class="mono" font-size="12" letter-spacing="1.5" fill="#ffb648">INFORMACIÓN, NO ASESORÍA</text>
    </g>

    <!-- calculation card -->
    <g transform="translate(784 48)">
      <rect width="448" height="324" rx="18" fill="#11141b" stroke="#eceee6" stroke-opacity="0.12"/>
      <rect x="0" y="22" width="5" height="280" rx="2.5" fill="#cfff45"/>
      <text x="28" y="40" class="mono" font-size="13" letter-spacing="1.5" fill="#969dab">RENTA $12,000.00 · INPC 2018=100</text>

      <!-- INPC Aug 2018 to Oct 2026, real monthly values -->
      <g transform="translate(18 64)">
        <path d="M0.0 74.0 L4.2 73.3 L8.4 72.5 L12.6 71.1 L16.8 70.0 L21.0 69.8 L25.2 69.9 L29.4 69.3 L33.6 69.2 L37.8 69.6 L42.0 69.5 L46.2 68.9 L50.4 68.9 L54.7 68.5 L58.9 67.6 L63.1 66.3 L67.3 65.3 L71.5 64.5 L75.7 63.8 L79.9 63.9 L84.1 65.6 L88.3 65.0 L92.5 64.1 L96.7 62.9 L100.9 62.3 L105.1 61.9 L109.3 60.8 L113.5 60.7 L117.7 60.0 L121.9 58.5 L126.1 57.4 L130.3 56.0 L134.5 55.4 L138.7 55.0 L142.9 54.1 L147.1 53.0 L151.3 52.7 L155.6 51.6 L159.8 50.0 L164.0 47.9 L168.2 47.3 L172.4 46.2 L176.6 44.6 L180.8 42.7 L185.0 41.7 L189.2 41.4 L193.4 39.7 L197.6 38.3 L201.8 36.9 L206.0 35.7 L210.2 34.6 L214.4 33.4 L218.6 32.7 L222.8 31.3 L227.0 30.2 L231.2 29.6 L235.4 29.7 L239.6 30.1 L243.8 29.9 L248.0 28.9 L252.2 27.8 L256.4 26.9 L260.7 26.1 L264.9 24.8 L269.1 23.3 L273.3 21.4 L277.5 21.2 L281.7 20.6 L285.9 20.2 L290.1 20.6 L294.3 19.8 L298.5 17.5 L302.7 17.5 L306.9 17.4 L311.1 16.2 L315.3 15.3 L319.5 14.4 L323.7 13.8 L327.9 13.2 L332.1 12.5 L336.3 11.8 L340.5 11.2 L344.7 10.5 L348.9 9.9 L353.1 9.8 L357.3 9.3 L361.6 8.5 L365.8 7.0 L370.0 6.3 L374.2 5.5 L378.4 4.3 L382.6 2.4 L386.8 1.9 L391.0 2.4 L395.2 3.0 L399.4 3.0 L403.6 2.5 L407.8 1.5 L412.0 0.0 V80 H0 Z" fill="url(#area)" class="count"/>
        <path class="draw" d="M0.0 74.0 L4.2 73.3 L8.4 72.5 L12.6 71.1 L16.8 70.0 L21.0 69.8 L25.2 69.9 L29.4 69.3 L33.6 69.2 L37.8 69.6 L42.0 69.5 L46.2 68.9 L50.4 68.9 L54.7 68.5 L58.9 67.6 L63.1 66.3 L67.3 65.3 L71.5 64.5 L75.7 63.8 L79.9 63.9 L84.1 65.6 L88.3 65.0 L92.5 64.1 L96.7 62.9 L100.9 62.3 L105.1 61.9 L109.3 60.8 L113.5 60.7 L117.7 60.0 L121.9 58.5 L126.1 57.4 L130.3 56.0 L134.5 55.4 L138.7 55.0 L142.9 54.1 L147.1 53.0 L151.3 52.7 L155.6 51.6 L159.8 50.0 L164.0 47.9 L168.2 47.3 L172.4 46.2 L176.6 44.6 L180.8 42.7 L185.0 41.7 L189.2 41.4 L193.4 39.7 L197.6 38.3 L201.8 36.9 L206.0 35.7 L210.2 34.6 L214.4 33.4 L218.6 32.7 L222.8 31.3 L227.0 30.2 L231.2 29.6 L235.4 29.7 L239.6 30.1 L243.8 29.9 L248.0 28.9 L252.2 27.8 L256.4 26.9 L260.7 26.1 L264.9 24.8 L269.1 23.3 L273.3 21.4 L277.5 21.2 L281.7 20.6 L285.9 20.2 L290.1 20.6 L294.3 19.8 L298.5 17.5 L302.7 17.5 L306.9 17.4 L311.1 16.2 L315.3 15.3 L319.5 14.4 L323.7 13.8 L327.9 13.2 L332.1 12.5 L336.3 11.8 L340.5 11.2 L344.7 10.5 L348.9 9.9 L353.1 9.8 L357.3 9.3 L361.6 8.5 L365.8 7.0 L370.0 6.3 L374.2 5.5 L378.4 4.3 L382.6 2.4 L386.8 1.9 L391.0 2.4 L395.2 3.0 L399.4 3.0 L403.6 2.5 L407.8 1.5 L412.0 0.0" fill="none" stroke="#cfff45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle class="tip" cx="412" cy="0" r="6" fill="#cfff45"/>
        <text x="0" y="98" class="mono" font-size="11" fill="#969dab">AGO 2018 · 100.492</text>
        <text x="412" y="98" text-anchor="end" class="mono" font-size="11" fill="#969dab">OCT 2026 · 147.026</text>
      </g>

      <text x="28" y="196" class="mono" font-size="14" fill="#eceee6">147.026 ÷ 141.708 = <tspan fill="#cfff45" font-weight="700">1.037528</tspan></text>
      <text x="28" y="250" class="mono count" font-size="42" font-weight="700" fill="#cfff45" letter-spacing="-1">$12,450.33</text>
      <text x="300" y="250" class="mono count" font-size="18" font-weight="700" fill="#eceee6">+3.75%</text>

      <!-- CDMX check -->
      <g transform="translate(28 274)">
        <rect width="392" height="32" rx="16" fill="#191d27" stroke="#ff5d47" stroke-opacity="0.6"/>
        <circle cx="18" cy="16" r="10" fill="#ff5d47"/>
        <path d="M14 12 22 20M22 12 14 20" stroke="#0a0c10" stroke-width="2.6" stroke-linecap="round"/>
        <text x="38" y="21" class="mono" font-size="12.5" fill="#eceee6">te piden 8%: excede el tope CDMX (3.69%)</text>
      </g>
    </g>
  </g>
</svg>
